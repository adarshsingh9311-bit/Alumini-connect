services:
  # 1. Python FastAPI Multi-Agent Microservice (LangGraph)
  - type: web
    name: alumni-connect-agent-service
    runtime: python
    region: oregon
    plan: free
    rootDir: agent_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. React 19 + Vite Static Site Frontend
  - type: web
    name: alumni-connect-web
    runtime: static
    region: oregon
    plan: free
    rootDir: glbajaj-alumni-connect
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
